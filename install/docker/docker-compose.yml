services:
  postgres:
    image: postgres:16
    volumes:
      - ../.data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=chainlit
    ports:
      - "5432:5432"
    networks:
      - shared_network
  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: ${APP_AWS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${APP_AWS_SECRET_KEY}
      AWS_REGION: ${APP_AWS_REGION}
      AWS_ENDPOINT_URL: ${DEV_AWS_ENDPOINT}
    ports:
      - 4567:4566
    volumes:
      - "../install/localstack-init:/etc/localstack/init/ready.d"
    env_file:
      - ../../.env
    networks:
      - shared_network

  tts-webui:
    build:
      context: ..
      dockerfile: docker/TTS-WebUI.Dockerfile
    ports:
      - "7778:7778"
      - "7770:7770"
      - "3000:3000"
    volumes:
      - tts_models:/root/.cache/huggingface
      - /c/Users/jbras/GitHub/chainloot-Yoda-Bot-Interface/tts_voices:/app/tts-webui/voices
    env_file:
      - ../../.env
    environment:
      - TTS_PORT=7778
      - UI_PORT=3000
      - STT_BASE_URL=http://tts-webui:7778
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - shared_network

  chainlit:
    build:
      context: ../..
      dockerfile: install/docker/Dockerfile
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ../../:/app
      - ../../ssl:/app/ssl
      - ../../uploads:/app/uploads
    env_file:
      - ../../.env
    environment:
      - TTS_BASE_URL=http://tts-webui:7778
      - STT_BASE_URL=http://tts-webui:7778
      - DATABASE_URL=postgresql://root:root@postgres:5432/chainlit
    depends_on:
      - postgres
      - localstack
      - ollama
      - tts-webui
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - shared_network

  ollama:
    build:
      context: ..
      dockerfile: docker/Ollama.Dockerfile
    ports:
      - "11434:11434"
    volumes:
      - ../../ollama_data:/root/.ollama
      - ../../ollama_app:/app
    env_file:
      - ../../.env
    environment:
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-4096}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - shared_network

  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./passwd:/mosquitto/config/passwd
    networks:
      - shared_network

networks:
  shared_network:
    driver: bridge

volumes:
  tts_models: