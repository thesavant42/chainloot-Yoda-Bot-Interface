services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - ./database/.data/postgres:/var/lib/postgresql/data
    env_file:
      - ./localstack/localstack.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - shared_network
  localstack:
    image: localstack/localstack:latest
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: ${APP_AWS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${APP_AWS_SECRET_KEY}
      AWS_REGION: ${APP_AWS_REGION}
      AWS_ENDPOINT_URL: ${DEV_AWS_ENDPOINT}
    ports:
      - 4567:4566
    volumes:
      - "./localstack/localstack-init:/etc/localstack/init/ready.d"
    env_file:
      - ./localstack/localstack.env
    networks:
      - shared_network

  tts-webui:
    build:
      dockerfile: ./tts-webui/TTS-WebUI.Dockerfile
    restart: unless-stopped
    ports:
      - "7778:7778"
      - "7770:7770"
      - "3000:3000"
    volumes:
      - ./tts-webui/tts_models:/root/.cache/huggingface
      - ./tts-webui/tts_voices:/app/tts-webui/voices
      - ./tts-webui:/app/host-scripts
    env_file:
      - ./tts-webui/tts-webui.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - shared_network

  chainlit:
    build:
      context: ./chainlit
      dockerfile: ./chainlit.Dockerfile
    restart: unless-stopped
    ports:
      - "8100:8100"
      - "8443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    models:
    - SmolLM3  
    volumes:
      - ./chainlit/:/app
      - ./chainlit/ssl:/app/ssl
      - ./chainlit/uploads:/app/uploads
    env_file:
      - ./chainlit/chainlit.env
    depends_on:
      - postgres
      - localstack
      - ollama
      - tts-webui
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - shared_network

  ollama:
    build:
      dockerfile: ./ollama/Ollama.Dockerfile
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama/ollama_data:/root/.ollama
      - ./ollama/ollama_app:/app
    env_file:
      - ./ollama//Ollama.env
    environment:
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-4096}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - shared_network

  mosquitto:
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/passwd:/mosquitto/config/passwd
    networks:
      - shared_network
  
  gpu-monitor:
    build:
      dockerfile: ./gpu-monitor/gpu-monitor.dockerfile
    container_name: gpu-monitor
    ports:
      - "8081:8081"
    environment:
      - TZ=America/Los_Angeles   # update your timezone
    volumes:
      - /etc/localtime:/etc/localtime:ro  # Share host timezone
      - ./history:/app/history:rw    # Persist historical data and SQLite database with explicit rw permissions
      - ./logs:/app/logs:rw    # Persist logs with explicit rw permissions
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    runtime: nvidia
networks:
  shared_network:
    driver: bridge

volumes:
  tts_models:

models:
  SmolLM3:
    # Use the specific GGUF model from HuggingFace
    model: hf.co/unsloth/smollm3-3b-128k-gguf:q4_k_m
    # Large context size for the 128K variant
    context_size: 131072 # 8192
    # Runtime flags based on your markdown configuration
    runtime_flags:
      - "--jinja"                         # enable builtin template for /think mode
      - "--temp"
      - "0.8"
      - "--top-p" 
      - "0.9"
      - "--verbose"                       # Set verbosity level to infinity
      - "--verbose-prompt"                # Print a verbose prompt before generation
      - "--log-prefix"                    # Enable prefix in log messages
      - "--log-timestamps"                # Enable timestamps in log messages
      - "--log-colors"                    # Enable colored logging
      - "auto"
      - "--metrics"                       # Enable metrics
