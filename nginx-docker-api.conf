events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Upstream for open-webui
    upstream openwebui {
        server 192.168.1.98:8091;
    }

    # Upstream for vscode web
    upstream vscodeweb {
        server 192.168.1.98:57080;
    }

    # Upstream for esphome
    upstream esphome {
        server 192.168.1.98:6052;
    }

    # Upstream for docker-api
    upstream dockerapi {
        server 192.168.1.98:2375;
    }

    # Server for open-webui (port 9091)
    server {
        listen 9091 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/alfred.local4cert.pem;
        ssl_certificate_key /etc/nginx/ssl/alfred.local4-key.pem;

        location / {
            proxy_pass http://openwebui;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Server for vscode web (port 9092)
    server {
        listen 9092 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/alfred.local4cert.pem;
        ssl_certificate_key /etc/nginx/ssl/alfred.local4-key.pem;

        location / {
            proxy_pass http://vscodeweb;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Server for esphome (port 9093)
    server {
        listen 9093 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/alfred.local4cert.pem;
        ssl_certificate_key /etc/nginx/ssl/alfred.local4-key.pem;

        location / {
            proxy_pass http://esphome;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Server for docker-api (port 9094)
    server {
        listen 9094 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/alfred.local4cert.pem;
        ssl_certificate_key /etc/nginx/ssl/alfred.local4-key.pem;

        location / {
            proxy_pass http://dockerapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Docker API specific headers
            proxy_set_header Accept-Encoding "";
            proxy_set_header User-Agent $http_user_agent;

            # Allow larger response bodies for Docker API
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}