services:
  postgres:
    image: postgres:16
    volumes:
      - ../.data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=chainlit
    ports:
      - "5432:5432"
    networks:
      - shared_network
  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: s3
    ports:
      - 4566:4566
    volumes:
      - "../localstack-init:/etc/localstack/init/ready.d"
    networks:
      - shared_network

  tts-webui:
    build:
      context: .
      dockerfile: TTS-WebUI.Dockerfile
    ports:
      - "7778:7778"
      - "7770:7770"
      - "3000:3000"
    volumes:
      - tts_models:/root/.cache/huggingface
      - ../tts_voices:/app/tts-webui/voices
    environment:
      - TTS_PORT=7778
      - UI_PORT=3000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - shared_network

  chainlit:
    build: .
    ports:
      - "8000:8000"
      - "8443:8443"
    volumes:
      - ../ssl:/app/ssl
      - ../uploads:/app/uploads
    env_file:
      - ../.env
    environment:
      - TTS_BASE_URL=http://tts-webui:7778
      - STT_BASE_URL=http://tts-webui:7778
    depends_on:
      - postgres
      - localstack
      - ollama
    networks:
      - shared_network

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - shared_network

networks:
  shared_network:
    driver: bridge

volumes:
  ollama_data:
  tts_models: